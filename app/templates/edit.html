{% extends 'base.html' %}
{% block title %}Изменить задачу — TaskFlow{% endblock %}
{% block content %}<section class="intro"><span class="eyebrow">ДЕТАЛИ ЗАДАЧИ</span><h1>Уточним план.</h1><p>Короткое и понятное название помогает начать.</p></section>
<section class="panel"><h2>Изменить задачу</h2>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="edit-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Название задачи</label><input id="title" name="title" value="{{ task.title }}" maxlength="120" required><div class="edit-actions"><button class="primary">Сохранить</button><a class="action" href="{{ url_for('tasks.index') }}">Отмена</a></div></form></section>{% endblock %}
