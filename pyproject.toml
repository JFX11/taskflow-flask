[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["unit: pure function tests", "integration: Flask and SQLite tests", "system: real HTTP server and browser tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
