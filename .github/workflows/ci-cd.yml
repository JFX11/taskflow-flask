name: Tests and delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Unit, integration and system tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=reports/results.xml
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python }}
          path: |
            reports/
            coverage.xml
  delivery:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Container name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Smoke test published container
        run: |
          docker run -d --name taskflow-smoke -p 127.0.0.1:8000:8000 -e SECRET_KEY=ci-smoke-key "$IMAGE:$GITHUB_SHA"
          timeout 30 bash -c 'until curl --fail --silent http://127.0.0.1:8000/health; do sleep 1; done'
          curl --fail --silent http://127.0.0.1:8000/ | grep -q TaskFlow
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs taskflow-smoke || true
          docker rm -f taskflow-smoke || true
